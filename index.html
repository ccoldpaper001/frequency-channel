<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>文字论坛</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
</head>
<body>
  <!-- 顶部导航 -->
  <header>
    <h1>📝 文字论坛</h1>
    <div id="user-bar">
      <span id="user-email"></span>
      <button id="btn-logout" class="btn btn-outline" style="display:none">退出登录</button>
    </div>
  </header>

  <main>
    <!-- 未登录：登录/注册 -->
    <section id="auth-box" class="card">
      <div class="tabs">
        <button class="tab active" data-tab="login">登录</button>
        <button class="tab" data-tab="register">注册</button>
      </div>

      <form id="form-login" class="auth-form">
        <h2>登录</h2>
        <input type="email" id="login-email" placeholder="邮箱" required />
        <input type="password" id="login-password" placeholder="密码（至少6位）" minlength="6" required />
        <button type="submit" class="btn">登录</button>
        <p class="msg" id="login-msg"></p>
      </form>

      <form id="form-register" class="auth-form" style="display:none">
        <h2>注册</h2>
        <input type="text" id="reg-nickname" placeholder="昵称" required />
        <input type="email" id="reg-email" placeholder="邮箱" required />
        <input type="password" id="reg-password" placeholder="密码（至少6位）" minlength="6" required />
        <button type="submit" class="btn">注册</button>
        <p class="msg" id="reg-msg"></p>
      </form>
    </section>

    <!-- 已登录：发帖区 -->
    <section id="post-box" class="card" style="display:none">
      <h2>发表新帖</h2>
      <input type="text" id="post-title" placeholder="标题" maxlength="100" required />
      <textarea id="post-content" placeholder="写下你想说的内容..." rows="4"></textarea>
      <button id="btn-post" class="btn">发布</button>
      <p class="msg" id="post-msg"></p>
    </section>

    <!-- 帖子列表 -->
    <section id="posts-list">
      <h2>全部帖子</h2>
      <div id="posts"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
